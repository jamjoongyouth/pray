<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>어색할 때 이렇게 · 2026 청년교구 여름수련회</title>
  <meta name="description" content="나눔이 잘 안 풀릴 때 인도자를 위한 안내">
  <meta name="theme-color" content="#0b1026">

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@800&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/MaruBuri@977eeff68d1d40bcef341f09c1f56cce1903bb8a/subsets/MaruBuri-dynamic-subset.css">

  <link rel="stylesheet" href="css/style.css?v=13">
</head>
<body>
  <div class="stars" aria-hidden="true"></div>

  <main class="paper">
    <p class="paper-kicker">나눔 인도</p>
    <h1 class="paper-title">어색할 때</h1>
    <p class="paper-lead">기류가 어색하다면<br>이렇게 열어보세요</p>

    <div class="paper-card">
      <ol class="paper-steps">
        <li>오늘 기도회 시간이 어땠는지, 설교와 전반적인 분위기가 어땠는지 묻고 아이스브레이킹</li>
        <li>평소 기도하는 시간에 대한 고백 나누기</li>
        <li>어떤 대가지불을 하고 이 자리에 오게 되었는지 등 이 시간의 가치를 일깨워주기</li>
      </ol>
      <p class="paper-note">같은 간단한 인트로도 도움이 될 듯해요.</p>
    </div>

    <a class="paper-back" href="./">← 수련회 페이지로</a>
  </main>
</body>
</html>
